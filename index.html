<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabungin — Tabungan & Pengeluaran</title>
<meta name="description" content="Kelola tabungan, pengeluaran, target, dan wishlist Anda dengan mudah.">
<meta name="theme-color" content="#0E8F69">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0,0" />
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<div id="splash">
  <div class="splash-logo">T</div>
  <div style="font-family:'Sora',sans-serif;font-weight:700;color:var(--text)">Tabungin</div>
</div>

<div id="toast-wrap"></div>

<div id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand"><div class="logo">T</div><div class="name">Tabungin</div></div>
    <div id="sidebar-nav"></div>
  </aside>

  <main id="main">
    <div class="topbar">
      <div>
        <div class="greet">Halo 👋</div>
        <div class="page-title" id="page-title">Dashboard</div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="icon-btn" onclick="navigate('pengaturan')"><span class="material-symbols-rounded">settings</span></button>
        <button class="icon-btn" onclick="navigate('profil')"><span class="material-symbols-rounded">person</span></button>
      </div>
    </div>
    <div id="page-content"><!-- konten halaman dirender di sini --></div>
  </main>
</div>

<nav class="bottom-nav" id="bottom-nav"></nav>

<button class="fab" id="fab" style="display:none"><span class="material-symbols-rounded">add</span></button>

<div class="sheet-overlay" id="sheet-overlay" onclick="if(event.target===this) closeSheet()">
  <div class="sheet" id="sheet-content"></div>
</div>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box" id="confirm-box">
    <div class="icon"><span class="material-symbols-rounded" id="confirm-icon">help</span></div>
    <h3 id="confirm-title">Konfirmasi</h3>
    <p id="confirm-message"></p>
    <div class="actions">
      <button class="btn btn-ghost" id="confirm-cancel">Batal</button>
      <button class="btn btn-gold" id="confirm-ok">Oke</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/supabase.js"></script>
<script src="js/scanner.js"></script>
<script src="js/insight.js"></script>
<script src="js/ai.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(console.warn));
}
</script>
</body>
</html>
